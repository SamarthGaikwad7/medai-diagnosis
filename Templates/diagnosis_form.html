<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnosis Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;

            /* 🎨 Soft gradient background */
            background: linear-gradient(135deg, #eef2ff, #dbeafe);

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            max-width: 400px;
            width: 100%;
            padding: 25px;

            /* ✨ cleaner card */
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #4f46e5;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;

            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #6366f1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
        }

        .radio-group {
            display: flex;
            margin-bottom: 12px;
        }

        .radio-group label {
            flex: 1;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 11px;

            /* 🎨 modern button */
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;

            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #4f46e5;
        }

    </style>
</head>

<body>

    <form method="POST">
        <br><br>
        <br>
        <br>

        <h1>Diagnosis Form</h1>
        <input type="text" name="name" placeholder="Name" required>

        <input type="number" name="age" placeholder="Age" required>

        <select name="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <input type="number" name="height" placeholder="Height (cm)" required>
        <input type="number" name="weight" placeholder="Weight (kg)" required>
        <input type="number" step="0.1" name="blood_sugar" placeholder="Blood Sugar (mg/dL)" required>
        <input type="number" name="blood_pressure_sys" placeholder="Systolic BP" required>
        <input type="number" name="blood_pressure_dia" placeholder="Diastolic BP" required>
        <input type="number" step="0.1" name="cholesterol" placeholder="Cholesterol (mg/dL)" required>

        <label>Smoking:</label>
        <div class="radio-group">
            <label><input type="radio" name="smoking" value="1"> Yes</label>
            <label><input type="radio" name="smoking" value="0" checked> No</label>
        </div>

        <label>Snoring:</label>
        <div class="radio-group">
            <label><input type="radio" name="snoring" value="1"> Yes</label>
            <label><input type="radio" name="snoring" value="0" checked> No</label>
        </div>

        <label>Exercise:</label>
        <div class="radio-group">
            <label><input type="radio" name="exercise" value="1"> Yes</label>
            <label><input type="radio" name="exercise" value="0" checked> No</label>
        </div>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
